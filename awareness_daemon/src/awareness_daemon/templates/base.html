<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}EPSA Awareness Dashboard{% endblock %}</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
    <style>
        :root {
            --bg: #0b0e14;
            --bg-panel: #131722;
            --bg-panel-hover: #171c2b;
            --border: #232838;
            --text: #e6e9f0;
            --text-dim: #8b92a8;
            --accent: #6ee7b7;
            --accent-2: #60a5fa;
            --accent-3: #f472b6;
            --warn: #fbbf24;
            --radius: 14px;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
            background: radial-gradient(1200px 600px at 10% -10%, #17203a 0%, var(--bg) 55%);
            color: var(--text);
            min-height: 100vh;
        }
        header.topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 22px 36px;
            border-bottom: 1px solid var(--border);
            background: rgba(19, 23, 34, 0.6);
            backdrop-filter: blur(6px);
            position: sticky;
            top: 0;
            z-index: 10;
        }
        header.topbar .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            font-size: 1.15rem;
            letter-spacing: 0.3px;
        }
        header.topbar .brand .dot {
            width: 10px; height: 10px; border-radius: 50%;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            box-shadow: 0 0 12px var(--accent);
        }
        header.topbar a.back {
            color: var(--text-dim);
            text-decoration: none;
            font-size: 0.9rem;
            padding: 8px 14px;
            border: 1px solid var(--border);
            border-radius: 999px;
            transition: all .15s ease;
        }
        header.topbar a.back:hover {
            color: var(--text);
            border-color: var(--accent-2);
        }
        main {
            padding: 32px 36px 60px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 18px;
            margin-bottom: 32px;
        }
        .card {
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px 22px;
        }
        .stat-card .label {
            color: var(--text-dim);
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            margin-bottom: 8px;
        }
        .stat-card .value {
            font-size: 2rem;
            font-weight: 700;
        }
        .stat-card .value.energy { color: var(--accent); }
        .stat-card .value.jobs { color: var(--accent-2); }
        .stat-card .value.users { color: var(--accent-3); }
        h1.page-title {
            font-size: 1.6rem;
            margin: 0 0 4px;
        }
        p.subtitle {
            color: var(--text-dim);
            margin: 0 0 28px;
        }
        .panel {
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 24px;
            margin-bottom: 28px;
        }
        .panel h2 {
            margin-top: 0;
            font-size: 1.05rem;
            color: var(--text-dim);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        table th, table td {
            text-align: left;
            padding: 12px 14px;
            border-bottom: 1px solid var(--border);
            font-size: 0.92rem;
        }
        table th {
            color: var(--text-dim);
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.72rem;
            letter-spacing: 0.06em;
        }
        table tbody tr {
            transition: background .12s ease;
        }
        table tbody tr:hover {
            background: var(--bg-panel-hover);
        }
        table tbody tr:last-child td {
            border-bottom: none;
        }
        a.row-link {
            color: inherit;
            text-decoration: none;
            display: block;
        }
        .rank {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 26px; height: 26px;
            border-radius: 8px;
            background: var(--bg);
            border: 1px solid var(--border);
            font-size: 0.8rem;
            color: var(--text-dim);
            font-weight: 700;
        }
        .rank.gold { color: #fcd34d; border-color: #92702240; }
        .rank.silver { color: #d1d5db; border-color: #6b728040; }
        .rank.bronze { color: #f0a875; border-color: #92440022; }
        .bar-bg {
            width: 100%;
            height: 8px;
            background: var(--border);
            border-radius: 999px;
            overflow: hidden;
            margin-top: 6px;
        }
        .bar-fill {
            height: 100%;
            border-radius: 999px;
            background: linear-gradient(90deg, var(--accent-2), var(--accent));
        }
        .pill {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 999px;
            font-size: 0.75rem;
            background: rgba(110, 231, 183, 0.1);
            color: var(--accent);
            border: 1px solid rgba(110, 231, 183, 0.25);
        }
        .empty-state {
            text-align: center;
            padding: 50px 20px;
            color: var(--text-dim);
        }
        .compare-panel {
            border-color: rgba(244, 114, 182, 0.35);
            background: linear-gradient(135deg, rgba(244, 114, 182, 0.06), var(--bg-panel));
        }
        .compare-text {
            margin: 0;
            font-size: 1.02rem;
            color: var(--text);
            line-height: 1.6;
        }
        .compare-device {
            color: var(--accent-3);
            font-weight: 700;
        }
        .compare-time {
            color: var(--accent);
            font-weight: 700;
        }
        .chart-wrap {
            position: relative;
            height: 320px;
        }
        footer {
            text-align: center;
            color: var(--text-dim);
            font-size: 0.8rem;
            padding: 20px;
        }
    </style>
</head>
<body>
    <header class="topbar">
        <div class="brand"><span class="dot"></span> EPSA Awareness Dashboard</div>
        {% block headerlink %}{% endblock %}
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
    <footer>EPSA &middot; Energy Prediction &amp; Scheduling Awareness</footer>
    {% block scripts %}{% endblock %}
</body>
</html>
