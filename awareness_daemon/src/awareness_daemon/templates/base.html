<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}EPSA Awareness Dashboard{% endblock %}</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
    <style>
        :root {
            --page: #f9f9f7;
            --surface: #fcfcfb;
            --surface-hover: #f2f1ed;
            --border: rgba(11, 11, 11, 0.10);
            --border-strong: #c3c2b7;
            --grid: #e1e0d9;
            --text: #0b0b0b;
            --text-dim: #52514e;
            --text-muted: #898781;
            --blue: #2a78d6;
            --orange: #eb6834;
            --aqua: #1baf7a;
            --mono: ui-monospace, "SF Mono", "Cascadia Code", Consolas, "Roboto Mono", monospace;
            --radius: 6px;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
            background: var(--page);
            color: var(--text);
            min-height: 100vh;
        }
        header.topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px 36px;
            border-bottom: 1px solid var(--border-strong);
            background: var(--surface);
            position: sticky;
            top: 0;
            z-index: 10;
        }
        header.topbar .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-family: var(--mono);
            font-weight: 600;
            font-size: 1rem;
            letter-spacing: 0.01em;
        }
        header.topbar .brand .dot {
            width: 9px; height: 9px;
            background: var(--blue);
            border: 1px solid var(--text);
        }
        header.topbar a.back {
            color: var(--text-dim);
            text-decoration: none;
            font-size: 0.85rem;
            font-family: var(--mono);
            padding: 7px 12px;
            border: 1px solid var(--border-strong);
            border-radius: 4px;
            transition: all .12s ease;
        }
        header.topbar a.back:hover {
            color: var(--text);
            border-color: var(--blue);
            background: var(--surface-hover);
        }
        main {
            padding: 32px 36px 60px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 14px;
            margin-bottom: 28px;
        }
        .card {
            background: var(--surface);
            border: 1px solid var(--border-strong);
            border-radius: var(--radius);
            padding: 18px 20px;
        }
        .stat-card .label {
            color: var(--text-muted);
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 10px;
            font-weight: 600;
        }
        .stat-card .value {
            font-family: var(--mono);
            font-size: 1.8rem;
            font-weight: 600;
            font-variant-numeric: tabular-nums;
        }
        .stat-card .value.energy { color: var(--blue); }
        .stat-card .value.jobs { color: var(--orange); }
        .stat-card .value.users { color: var(--aqua); }
        h1.page-title {
            font-size: 1.4rem;
            font-weight: 600;
            margin: 0 0 4px;
        }
        p.subtitle {
            color: var(--text-dim);
            margin: 0 0 24px;
            font-size: 0.92rem;
        }
        .panel {
            background: var(--surface);
            border: 1px solid var(--border-strong);
            border-radius: var(--radius);
            padding: 22px;
            margin-bottom: 22px;
        }
        .panel h2 {
            margin-top: 0;
            font-size: 0.78rem;
            color: var(--text-muted);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.07em;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        table th, table td {
            text-align: left;
            padding: 11px 14px;
            border-bottom: 1px solid var(--grid);
            font-size: 0.88rem;
        }
        table th {
            color: var(--text-muted);
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.68rem;
            letter-spacing: 0.06em;
            border-bottom: 1px solid var(--border-strong);
        }
        table td.num, table th.num {
            font-family: var(--mono);
            font-variant-numeric: tabular-nums;
        }
        table tbody tr {
            transition: background .1s ease;
        }
        table tbody tr:hover {
            background: var(--surface-hover);
        }
        table tbody tr:last-child td {
            border-bottom: none;
        }
        a.row-link {
            color: inherit;
            text-decoration: none;
            display: block;
        }
        .rank {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 22px; height: 22px;
            border-radius: 4px;
            background: var(--page);
            border: 1px solid var(--border-strong);
            font-family: var(--mono);
            font-size: 0.72rem;
            color: var(--text-muted);
            font-weight: 600;
        }
        .rank.gold { color: var(--text); border-color: var(--blue); }
        .rank.silver, .rank.bronze { color: var(--text-dim); }
        .bar-bg {
            width: 100%;
            height: 6px;
            background: var(--grid);
            border-radius: 3px;
            overflow: hidden;
            margin-top: 6px;
        }
        .bar-fill {
            height: 100%;
            background: var(--blue);
        }
        .pill {
            display: inline-block;
            font-family: var(--mono);
            font-variant-numeric: tabular-nums;
            color: var(--blue);
            font-weight: 600;
        }
        .empty-state {
            text-align: center;
            padding: 50px 20px;
            color: var(--text-muted);
            font-size: 0.9rem;
        }
        .compare-panel {
            border-left: 3px solid var(--blue);
            border-radius: 0 var(--radius) var(--radius) 0;
        }
        .compare-text {
            margin: 0;
            font-size: 0.95rem;
            color: var(--text);
            line-height: 1.6;
        }
        .compare-device {
            color: var(--orange);
            font-weight: 700;
            font-family: var(--mono);
        }
        .compare-time {
            color: var(--blue);
            font-weight: 700;
            font-family: var(--mono);
        }
        .chart-wrap {
            position: relative;
            height: 320px;
        }
        footer {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.78rem;
            font-family: var(--mono);
            padding: 20px;
            border-top: 1px solid var(--grid);
        }
    </style>
</head>
<body>
    <header class="topbar">
        <div class="brand"><span class="dot"></span> EPSA Awareness Dashboard</div>
        {% block headerlink %}{% endblock %}
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
    <footer>EPSA &middot; Energy Prediction &amp; Scheduling Awareness</footer>
    {% block scripts %}{% endblock %}
</body>
</html>
